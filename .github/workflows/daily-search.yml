name: Cabins41 daily source check
on:
  push:
    branches: [codex/strict-solo-sailing-dedupe]
    paths: ['.github/workflows/daily-search.yml']
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: write
concurrency:
  group: cabins41-daily
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      search_outcome: ${{ steps.search.outcome }}
      report_outcome: ${{ steps.report.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: codex/strict-solo-sailing-dedupe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record test start
        id: started
        shell: bash
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Search and save after each source
        id: search
        continue-on-error: true
        shell: bash
        run: |
          save_results() {
            git commit -m "$1" || return 1
            for attempt in 1 2 3; do
              if git pull --rebase origin codex/strict-solo-sailing-dedupe &&
                 git push origin HEAD:codex/strict-solo-sailing-dedupe; then
                return 0
              fi
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
                echo "::error::Results need reconciliation; preserved in the run artifact."
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
            done
            echo "::error::Could not save results after three attempts; preserved in the run artifact."
            return 1
          }
          git config user.name 'Cabins41 Search Bot'
          git config user.email 'actions@users.noreply.github.com'
          mapfile -t source_ids < <(python -c "import json; print('\\n'.join(str(x['id']) for x in json.load(open('sources.json', encoding='utf-8'))))")
          for index in "${!source_ids[@]}"; do
            n="${source_ids[$index]}"
            CABINS41_FORCE_RECHECK=1 python search.py --one "$n" --no-wait
            git add data/
            if ! git diff --cached --quiet; then
              save_results "Save source $n results" || exit 1
            fi
            if [ "$index" -lt "$((${#source_ids[@]} - 1))" ]; then sleep 20; fi
          done
          date="$(TZ=Europe/London date +%F)"
          cat "data/offers-${date}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Report every test, even on failure
        id: report
        if: always() && steps.started.outputs.time != ''
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CABINS41_FROM_EMAIL: ${{ secrets.CABINS41_FROM_EMAIL }}
        run: |
          code=0
          if [ "${{ steps.search.outcome }}" != "success" ]; then code=1; fi
          python report_test.py --since "${{ steps.started.outputs.time }}" --search-exit "$code" --output data/latest-test-report.md
          python compare_tests.py
          cat data/latest-test-report.md >> "$GITHUB_STEP_SUMMARY"
          save_results() {
            git commit -m "$1" || return 1
            for attempt in 1 2 3; do
              if git pull --rebase origin codex/strict-solo-sailing-dedupe &&
                 git push origin HEAD:codex/strict-solo-sailing-dedupe; then
                return 0
              fi
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
                echo "::error::Results need reconciliation; preserved in the run artifact."
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
            done
            echo "::error::Could not save results after three attempts; preserved in the run artifact."
            return 1
          }
          git config user.name 'Cabins41 Search Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/latest-test-report.md data/test-history/
          if ! git diff --cached --quiet; then
            save_results "Save test report for run $GITHUB_RUN_ID" || exit 1
          fi
      - name: Preserve results even if repository saving fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabins41-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          if-no-files-found: warn

  notify:
    name: Send completion notification
    needs: check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download this run's results
        id: results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cabins41-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results
      - name: Notify Robert when the search finishes
        uses: actions/github-script@v7
        env:
          SEARCH_OUTCOME: ${{ needs.check.outputs.search_outcome }}
          REPORT_OUTCOME: ${{ needs.check.outputs.report_outcome }}
          CHECK_OUTCOME: ${{ needs.check.result }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const marker = '<!-- cabins41-run:' + context.runId + ':' + process.env.GITHUB_RUN_ATTEMPT + ' -->';
            let report = '';
            const path = 'results/latest-test-report.md';
            if (fs.existsSync(path)) {
              const content = fs.readFileSync(path, 'utf8');
              if (content.includes(runUrl)) report = content;
            }
            report = report
              .replace('**Potential solo sailings (unverified):**', '**Solo cruise offers found:**')
              .replace('; **verified fares:** 0 (not independently checked)', '')
              .replace('## Potential offers requiring manual checking', '## Solo cruise offers found')
              .replace('No potential offers detected in this run.', 'No solo cruise offers found in this run.')
              .replace('All expected main sources were accounted for within the operational baseline. Offer quality still requires manual verification.', 'All expected main sources were accounted for within the operational baseline.')
              .replace('No offers have been approved for publication by this report.', '');
            const body = [
              marker,
              '@robertseviour-code — Cabins41 search completed.',
              'Completion notification: ' + new Date().toISOString(),
              'Run: ' + runUrl,
              'Search step: ' + (process.env.SEARCH_OUTCOME || 'unavailable — inspect run'),
              'Report step: ' + (process.env.REPORT_OUTCOME || 'unavailable — inspect run'),
              'Search job: ' + process.env.CHECK_OUTCOME,
              '',
              report || 'The report for this run could not be retrieved. Inspect the run steps and artifacts; no results are assumed.'
            ].join('\n');
            const params = {...context.repo, issue_number: 1};
            const comments = await github.paginate(github.rest.issues.listComments, {...params, per_page: 100});
            if (!comments.some(c => c.body && c.body.includes(marker))) {
              await github.rest.issues.createComment({...params, body: body.slice(0, 60000)});
            }
