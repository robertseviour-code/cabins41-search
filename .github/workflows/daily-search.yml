name: Cabins41 daily source check
on:
  workflow_dispatch:
  schedule:
    - cron: '30 */3 * * *'
permissions:
  contents: write
concurrency:
  group: cabins41-daily
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: codex/strict-solo-sailing-dedupe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record test start
        id: started
        shell: bash
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Search and save after each source
        id: search
        continue-on-error: true
        shell: bash
        run: |
          save_results() {
            git commit -m "$1" || return 1
            for attempt in 1 2 3; do
              if git pull --rebase origin codex/strict-solo-sailing-dedupe &&
                 git push origin HEAD:codex/strict-solo-sailing-dedupe; then
                return 0
              fi
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
                echo "::error::Results need reconciliation; preserved in the run artifact."
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
            done
            echo "::error::Could not save results after three attempts; preserved in the run artifact."
            return 1
          }
          git config user.name 'Cabins41 Search Bot'
          git config user.email 'actions@users.noreply.github.com'
          mapfile -t source_ids < <(python -c "import json; print('\\n'.join(str(x['id']) for x in json.load(open('sources.json', encoding='utf-8'))))")
          for index in "${!source_ids[@]}"; do
            n="${source_ids[$index]}"
            CABINS41_FORCE_RECHECK=1 python search.py --one "$n" --no-wait
            git add data/
            if ! git diff --cached --quiet; then
              save_results "Save source $n results" || exit 1
            fi
            if [ "$index" -lt "$((${#source_ids[@]} - 1))" ]; then sleep 20; fi
          done
          date="$(TZ=Europe/London date +%F)"
          cat "data/offers-${date}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Report every test, even on failure
        id: report
        if: always() && steps.started.outputs.time != ''
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CABINS41_FROM_EMAIL: ${{ secrets.CABINS41_FROM_EMAIL }}
        run: |
          code=0
          if [ "${{ steps.search.outcome }}" != "success" ]; then code=1; fi
          python report_test.py --since "${{ steps.started.outputs.time }}" --search-exit "$code" --output data/latest-test-report.md
          python compare_tests.py
          cat data/latest-test-report.md >> "$GITHUB_STEP_SUMMARY"
          save_results() {
            git commit -m "$1" || return 1
            for attempt in 1 2 3; do
              if git pull --rebase origin codex/strict-solo-sailing-dedupe &&
                 git push origin HEAD:codex/strict-solo-sailing-dedupe; then
                return 0
              fi
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
                echo "::error::Results need reconciliation; preserved in the run artifact."
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
            done
            echo "::error::Could not save results after three attempts; preserved in the run artifact."
            return 1
          }
          git config user.name 'Cabins41 Search Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/latest-test-report.md data/test-history/
          if ! git diff --cached --quiet; then
            save_results "Save test report for run $GITHUB_RUN_ID" || exit 1
          fi
      - name: Email the completed search report
        if: always() && steps.started.outputs.time != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CABINS41_FROM_EMAIL: ${{ secrets.CABINS41_FROM_EMAIL }}
          SEARCH_OUTCOME: ${{ steps.search.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          key = os.environ.get("RESEND_API_KEY", "")
          sender = os.environ.get("CABINS41_FROM_EMAIL", "")
          if not key or not sender:
              raise SystemExit("Email notification not sent: RESEND_API_KEY or CABINS41_FROM_EMAIL is missing.")
          report_path = Path("data/latest-test-report.md")
          report = report_path.read_text(encoding="utf-8") if report_path.exists() else "The search report was not produced."
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body = (
              f"Cabins41 search finished.\n\n"
              f"Search step: {os.environ.get('SEARCH_OUTCOME', 'unknown')}\n"
              f"Report step: {os.environ.get('REPORT_OUTCOME', 'unknown')}\n"
              f"GitHub run: {run_url}\n\n"
              f"{report}"
          )
          payload = json.dumps({
              "from": sender,
              "to": ["robertseviour@gmail.com"],
              "subject": f"Cabins41 search finished — run {os.environ['GITHUB_RUN_ID']}",
              "text": body,
          }).encode()
          request = urllib.request.Request(
              "https://api.resend.com/emails",
              data=payload,
              headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201, 202):
                  raise SystemExit(f"Email service returned HTTP {response.status}.")
              print(f"Completion email accepted by sending service (HTTP {response.status}).")
          PY
      - name: Preserve results even if repository saving fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabins41-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          if-no-files-found: warn
