name: Cabins41 daily source check
on:
  workflow_dispatch:
  schedule:
    - cron: '30 */3 * * *'
permissions:
  contents: write
concurrency:
  group: cabins41-daily
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: codex/strict-solo-sailing-dedupe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match 02:30 London time
        id: localtime
        shell: bash
        run: |
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Search and save after each source
        if: steps.localtime.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'Cabins41 Search Bot'
          git config user.email 'actions@users.noreply.github.com'
          for n in $(seq 1 85); do
            CABINS41_FORCE_RECHECK=1 python search.py --one "$n" --no-wait
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "Save source $n results" && git pull --rebase origin codex/strict-solo-sailing-dedupe && git push origin HEAD:codex/strict-solo-sailing-dedupe || exit 1
            fi
            if [ "$n" -lt 85 ]; then sleep 20; fi
          done
          date="$(TZ=Europe/London date +%F)"
          cat "data/offers-${date}.md" >> "$GITHUB_STEP_SUMMARY"
