name: Cabins41 daily source check
on:
  push:
    branches: [codex/strict-solo-sailing-dedupe]
    paths:
      - '.github/workflows/daily-search.yml'
      - 'search.py'
  workflow_dispatch:
  schedule:
    - cron: '30 */3 * * *'
permissions:
  contents: write
concurrency:
  group: cabins41-daily
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: codex/strict-solo-sailing-dedupe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match 02:30 London time
        id: localtime
        shell: bash
        run: |
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Search and save after each source
        if: steps.localtime.outputs.run == 'true'
        shell: bash
        run: |
          save_results() {
            git commit -m "$1" || return 1
            for attempt in 1 2 3; do
              if git pull --rebase origin codex/strict-solo-sailing-dedupe &&
                 git push origin HEAD:codex/strict-solo-sailing-dedupe; then
                return 0
              fi
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
                echo "::error::Results need reconciliation; preserved in the run artifact."
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
            done
            echo "::error::Could not save results after three attempts; preserved in the run artifact."
            return 1
          }
          git config user.name 'Cabins41 Search Bot'
          git config user.email 'actions@users.noreply.github.com'
          commit_message="${{ github.event.head_commit.message }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            case "$commit_message" in
              "RUN FIVE SOURCES"*) source_ids="4 15 22 84" ;;
              "RUN FULL SEARCH"*) source_ids="$(seq 1 85)" ;;
              "RUN REMAINING SOURCES"*) source_ids="$(seq 1 85 | grep -v -E '^(4|15|22|84)$')" ;;
              *) echo "No search requested by this change."; exit 0 ;;
            esac
          else
            source_ids="$(seq 1 85)"
          fi
          last_id="$(printf '%s\n' "$source_ids" | awk '{print $NF}')"
          for n in $source_ids; do
            CABINS41_FORCE_RECHECK=1 python search.py --one "$n" --no-wait
            git add data/
            if ! git diff --cached --quiet; then
              save_results "Save source $n results" || exit 1
            fi
            if [ "$n" != "$last_id" ]; then sleep 20; fi
          done
          date="$(TZ=Europe/London date +%F)"
          cat "data/offers-${date}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve results even if repository saving fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabins41-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          if-no-files-found: warn

