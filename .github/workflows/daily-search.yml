name: Cabins41 daily source check
on:
  push:
    branches: [codex/strict-solo-sailing-dedupe]
    paths:
      - '.github/workflows/daily-search.yml'
      - 'search.py'
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
    - cron: '30 2 * * *'
permissions:
  contents: write
concurrency:
  group: cabins41-daily
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match 02:30 London time
        id: localtime
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ] || [ "$(TZ=Europe/London date +%H)" = "02" ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; fi
      - name: Search and save after each source
        if: steps.localtime.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'Cabins41 Search Bot'
          git config user.email 'actions@users.noreply.github.com'
          commit_message="${{ github.event.head_commit.message }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            case "$commit_message" in
              "RUN FIVE SOURCES"*) source_ids="6 17 35 43 61" ;;
              "RUN FULL SEARCH"*) source_ids="$(seq 1 85)" ;;
              *) echo "No search requested by this change."; exit 0 ;;
            esac
          else
            source_ids="$(seq 1 85)"
          fi
          last_id="$(printf '%s\n' "$source_ids" | awk '{print $NF}')"
          for n in $source_ids; do
            python search.py --one "$n" --no-wait
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "Save source $n results" && git push || exit 1
            fi
            if [ "$n" != "$last_id" ]; then sleep 20; fi
          done
          date="$(TZ=Europe/London date +%F)"
          cat "data/offers-${date}.md" >> "$GITHUB_STEP_SUMMARY"
